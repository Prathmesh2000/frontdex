name: Feature request
description: A framework, router, pattern or agent frontdex should understand, or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what frontdex misses today.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example code
      description: For detection requests, a small real-world snippet of the pattern.
      render: tsx
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I would like to open a PR for this
